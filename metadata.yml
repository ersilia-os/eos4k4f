Identifier: eos4k4f
Slug: standardization
Status: Ready
Title: Small molecule standardization
Description: 'Returns a molecule at five increasing levels of abstraction: the canonical SMILES, a ChEMBL-standardised parent with salts and charges resolved, a form with stereochemistry stripped, the Bemis-Murcko scaffold, and a generic scaffold in which atom types are discarded. Working through these levels lets compounds be grouped by shared framework even when they differ in decoration or salt form, which is the usual prerequisite for deduplicating a screening collection.'
